services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-web_maga}
      POSTGRES_USER: ${POSTGRES_USER:-web_maga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo_password}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    command: ["sh", "-c", "npm run db && exec npm start"]
    environment:
      PORT: 3000
      FINE_PER_DAY: ${FINE_PER_DAY-10}
      CRON_SCHEDULE: ${CRON_SCHEDULE-5 0 * * *}
      DATABASE_URL: postgresql://${POSTGRES_USER:-web_maga}:${POSTGRES_PASSWORD:-demo_password}@db:5432/${POSTGRES_DB:-web_maga}
      TZ: UTC
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
